name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    name: Compile firmware (${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - board: Waveshare AMOLED 1.75
            flags: ""
          - board: Waveshare AMOLED 2.16
            flags: "-DBOARD_AMOLED_216"
    steps:
      - uses: actions/checkout@v7

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      # Pinned to the core version verified to build this sketch. Bump it
      # by hand and on purpose: a newer core version has broken third-party
      # libraries before.
      - name: Install ESP32 core
        run: |
          arduino-cli config init --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12

      - name: Install libraries
        run: arduino-cli lib install "GFX Library for Arduino" SensorLib XPowersLib

      - name: Compile
        if: matrix.flags == ''
        run: >
          arduino-cli compile --warnings=all
          --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB"
          .

      - name: Compile (with board flags)
        if: matrix.flags != ''
        run: >
          arduino-cli compile --warnings=all
          --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB"
          --build-property "compiler.cpp.extra_flags=${{ matrix.flags }}"
          --build-property "compiler.c.extra_flags=${{ matrix.flags }}"
          .

  generated:
    name: Generated headers up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install pillow

      - name: Regenerate dex.h and species.h
        run: |
          python3 tools/gen_dex.py
          python3 tools/sprites.py emit

      # dex.h and species.h carry "GENERADO - no editar" in their header; this catches
      # anyone who edits the output instead of the generator, or forgets to regenerate
      # after touching the source data.
      - name: Fail if regenerating produced a diff
        run: git diff --exit-code -- dex.h species.h

  tools-lint:
    name: Lint tools/ (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install ruff
      - run: ruff check tools/

  tests:
    name: Game-logic tests (host, no board)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      # pet.cpp / i18n.cpp / dex.h build and run on the PC against Arduino shims,
      # with fake millis() and random() and an in-memory NVS. This is
      # where things have broken: the three bugs in v1.3, v1.4 and v1.8 were
      # pure logic and these tests catch them without touching the board.
      - name: Run the suite (plus AddressSanitizer + UBSan)
        run: ./test/run_tests.sh --asan

  ui-screens:
    name: UI screens match the reference images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install pillow
      - uses: arduino/setup-arduino-cli@v2
      # the renderer builds the graphics code of GFX Library for Arduino; pinned version
      # because the reference images depend on it
      - run: arduino-cli lib install "GFX Library for Arduino@1.6.9"
      # builds the sketch against a software canvas and compares every screen
      # (test/render). If the interface change is intentional: make golden.
      - run: make -C test/render check
      # tap the center of every button and check that every string fits where it is drawn
      - run: make -C test/render taps fit power
      # and the 480 px square panel (2.16): taps and texts too
      - run: make -C test/render taps fit ROUND=0 SIZE=480
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ui-screen-diffs
          path: |
            test/render/build/shots/*/*.diff.png
            test/render/build/shots/*/*.actual.png
