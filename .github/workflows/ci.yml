name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    name: Compile firmware (${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - board: Waveshare AMOLED 1.75
            flags: ""
          - board: Waveshare AMOLED 2.16
            flags: "-DBOARD_AMOLED_216"
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      # Fijado a la version del core verificada para compilar este sketch. Subirla
      # a mano y a proposito: alguna version nueva del core ha roto librerias de
      # terceros antes.
      - name: Install ESP32 core
        run: |
          arduino-cli config init --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10

      - name: Install libraries
        run: arduino-cli lib install "GFX Library for Arduino" SensorLib XPowersLib

      - name: Compile
        if: matrix.flags == ''
        run: >
          arduino-cli compile --warnings=all
          --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB"
          .

      - name: Compile (with board flags)
        if: matrix.flags != ''
        run: >
          arduino-cli compile --warnings=all
          --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB"
          --build-property "compiler.cpp.extra_flags=${{ matrix.flags }}"
          --build-property "compiler.c.extra_flags=${{ matrix.flags }}"
          .

  generated:
    name: Generated headers up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pillow

      - name: Regenerate dex.h and species.h
        run: |
          python3 tools/gen_dex.py
          python3 tools/sprites.py emit

      # dex.h y species.h llevan "GENERADO - no editar" en su cabecera; esto pilla
      # a quien edite la salida en vez del generador, o se olvide de regenerar
      # tras tocar los datos de origen.
      - name: Fail if regenerating produced a diff
        run: git diff --exit-code -- dex.h species.h

  tools-lint:
    name: Lint tools/ (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install ruff
      - run: ruff check tools/

  tests:
    name: Game-logic tests (host, no board)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # pet.cpp / i18n.cpp / dex.h compilan y corren en el PC contra unos shims
      # de Arduino, con millis() y random() falsos y una NVS en memoria. Aqui es
      # donde se han roto las cosas: los tres bugs de la v1.3, v1.4 y v1.8 eran
      # logica pura y estos tests los pillan sin tocar la placa.
      - name: Run the suite (plus AddressSanitizer + UBSan)
        run: ./test/run_tests.sh --asan

  i18n:
    name: i18n table sizes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 tools/test_i18n_formats.py

  ui-screens:
    name: UI screens match the reference images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pillow
      - uses: arduino/setup-arduino-cli@v2
      # el renderer compila el codigo grafico de GFX Library for Arduino; version fijada
      # porque las imagenes de referencia dependen de ella
      - run: arduino-cli lib install "GFX Library for Arduino@1.6.9"
      # compila el sketch contra un lienzo por software y compara cada pantalla
      # (test/render). Si el cambio de interfaz es intencionado: make golden.
      - run: make -C test/render check
      # tocar el centro de cada boton y comprobar que cada cadena cabe donde se dibuja
      - run: make -C test/render taps fit power
      # y el panel cuadrado de 480 px (2.16): toques y textos tambien
      - run: make -C test/render taps fit ROUND=0 SIZE=480
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-screen-diffs
          path: |
            test/render/build/shots/*/*.diff.png
            test/render/build/shots/*/*.actual.png
